# Dependency updates once a month. Minor and patch updates share one pull request
# per ecosystem, so a major upgrade arrives on its own and can fail on its own.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
